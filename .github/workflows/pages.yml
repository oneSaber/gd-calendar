name: Deploy static calendar to GitHub Pages

# 部署的是**只读静态快照**（docs/ 目录）：
#   * 数据由 `python -m app.cli build-static` 在本地导出后随代码提交
#   * 本工作流只负责「把 docs/ 发布到 Pages」，不在 CI 里采集
#
# 为什么不在 CI 里采集：
#   1. 采集依赖真人节奏与限速（一轮 1–3 分钟，浏览器源还要 Edge/Chrome），
#      放在 CI 里既慢又容易被目标站点当成异常流量；
#   2. 采集结果需要人工过一遍（本项目对「宁缺勿错」有明确要求）。
# 需要更新线上数据时：本地跑 `更新数据.bat` → `python -m app.cli build-static` → 提交 docs/。

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消排队中的旧任务，但不打断进行中的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check（docs 必须是可发布的静态站点）
        run: |
          set -e
          test -f docs/index.html || { echo "缺少 docs/index.html"; exit 1; }
          test -f docs/.nojekyll || { echo "缺少 docs/.nojekyll（会触发 Jekyll 处理）"; exit 1; }
          test -f docs/data/occurrences.json || { echo "缺少 docs/data/occurrences.json"; exit 1; }
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('docs/index.html', 'utf8');
            if (!html.includes('__STATIC__')) {
              console.error('docs/index.html 缺少 __STATIC__ 标记，前端会去请求不存在的后端');
              process.exit(1);
            }
            const data = JSON.parse(fs.readFileSync('docs/data/occurrences.json', 'utf8'));
            if (!Array.isArray(data.items) || data.items.length === 0) {
              console.error('occurrences.json 为空');
              process.exit(1);
            }
            console.log('静态站点检查通过：' + data.items.length + ' 条场次');
          "

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
